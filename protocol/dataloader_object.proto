syntax = "proto3";

package dataloader_object;

// 1. client -> coordinator
// 2. coordinator -> data_server
message ObjectRequest {
  string client_id = 1;          // client uuid
  bytes serialized_data = 2;     // dataloader object
  int64 queue_index = 3;         // index into result_queue_list for NPU/CUDA shared memory delivery
}

// 3. coordinator -> client
// 4. data_server -> coordinator
message ObjectResponse {
  string client_id = 1;          // client uuid
}
