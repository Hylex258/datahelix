syntax = "proto3";

package coordinator;

import "index.proto";
import "client.proto";
import "heartbeat.proto";
import "dataloader_object.proto";

service CoordinatorService {
  // Register client from Client.
  rpc ClientRegister(client.ClientRequest) returns (client.ClientResponse) {}
  // Deregister client from Client.
  rpc ClientDeregister(client.ClientRequest) returns (client.ClientResponse) {}
  // Assign index from Client.
  rpc AssignIndex(index.IndexRequest) returns (index.IndexResponse) {}
  // Assign DataLoader from Client.
  rpc AssignDataloaderObject(dataloader_object.ObjectRequest) returns (dataloader_object.ObjectResponse) {}
  // Terminate the Coordinator.
  rpc Terminate(client.ClientRequest) returns (client.ClientResponse) {}

  // Register data server from DataServer.
  rpc DataServerRegister(heartbeat.PingRequest) returns (heartbeat.PingResponse) {}
  // Deregister data server from DataServer.
  rpc DataServerDeregister(heartbeat.PingRequest) returns (heartbeat.PingResponse) {}
  // Heartbeat of DataServer.
  rpc DataServerHeartbeat(heartbeat.PingRequest) returns (heartbeat.PingResponse) {}
  // Heartbeat of Coordinator.
  rpc Ping(heartbeat.PingRequest) returns (heartbeat.PingResponse) {}
}
