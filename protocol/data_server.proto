syntax = "proto3";

package data_server;

import "index.proto";
import "heartbeat.proto";
import "dataloader_object.proto";
import "metadata.proto";

service DataServerService {
  // Assign index from Coordinator.
  rpc AssignIndex(index.IndexRequest) returns (index.IndexResponse) {}
  // Get data from Client.
  rpc GetData(index.IndexResponse) returns (stream index.DataResponse) {}
  // Assign DataLoader from Coordinator.
  rpc AssignDataloaderObject(dataloader_object.ObjectRequest) returns (dataloader_object.ObjectResponse) {}
  // Terminate the DataServer.
  rpc Terminate(heartbeat.PingRequest) returns (heartbeat.PingResponse) {}
  // Heartbeat of DataServer.
  rpc Ping(heartbeat.PingRequest) returns (heartbeat.PingResponse) {}
  // Receive metadata from another DataServer (cluster communication).
  rpc ReceiveMetadata(metadata.MetadataRequest) returns (metadata.MetadataResponse) {}
}
